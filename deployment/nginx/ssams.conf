# Template only: replace hostname, certificate paths, root path, and upstream as documented.
# This template terminates TLS and proxies /api/ to FastAPI while serving frontend/dist itself.
# A single-port alternative is `python -m app.cli serve` (APP_HOST=0.0.0.0, APP_PORT=8000): the
# application then serves the built SPA at / itself, and only that one port needs to be exposed.
# Install this in the institution-managed Nginx site configuration and test with nginx -t.
server {
    listen 80;
    server_name attendance.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name attendance.example.edu;

    ssl_certificate     /etc/letsencrypt/live/attendance.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSAMS_TLS:10m;
    ssl_session_tickets off;

    root /opt/ssams/frontend/dist;
    index index.html;
    client_max_body_size 9m;

    include /opt/ssams/deployment/nginx/security-headers.conf;

    location = /index.html {
        include /opt/ssams/deployment/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /assets/ {
        include /opt/ssams/deployment/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
